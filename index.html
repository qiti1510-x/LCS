<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最长公共子序列(LCS)算法可视化</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eaeaea;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 1.2rem;
        }
        
        .input-section {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }
        
        .input-group {
            flex: 1;
            min-width: 300px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #34495e;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }
        
        button {
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            min-width: 120px;
        }
        
        button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .visualization {
            margin: 40px 0;
            overflow-x: auto;
        }
        
        .dp-table {
            border-collapse: collapse;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .dp-table td {
            width: 50px;
            height: 50px;
            text-align: center;
            vertical-align: middle;
            border: 1px solid #ddd;
            font-weight: bold;
            position: relative;
            transition: all 0.5s ease;
        }
        
        .dp-table th {
            background-color: #2c3e50;
            color: white;
            padding: 12px;
            min-width: 50px;
        }
        
        .dp-header {
            background-color: #34495e;
            color: white;
        }
        
        .dp-cell-empty {
            background-color: #f8f9fa;
        }
        
        .dp-cell-current {
            background-color: #3498db;
            color: white;
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.7);
        }
        
        .dp-cell-visited {
            background-color: #e1f5fe;
        }
        
        .dp-cell-match {
            background-color: #2ecc71;
            color: white;
        }
        
        .path-cell {
            background-color: #f1c40f;
            color: white;
        }
        
        .info-panel {
            background-color: #f8f9fa;
            border-left: 4px solid #3498db;
            padding: 20px;
            border-radius: 0 8px 8px 0;
            margin-top: 30px;
        }
        
        .info-panel h2 {
            color: #2c3e50;
            margin-bottom: 15px;
        }
        
        .info-content {
            padding: 15px;
            background-color: white;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            font-size: 1.1rem;
            line-height: 1.8;
        }
        
        .step-info {
            font-weight: 600;
            color: #3498db;
            margin-bottom: 10px;
        }
        
        .result {
            font-size: 1.3rem;
            color: #e74c3c;
            margin-top: 10px;
            font-weight: bold;
        }
        
        .legend {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .legend-box {
            width: 25px;
            height: 25px;
            border: 1px solid #ddd;
        }
        
        .complexity {
            text-align: center;
            margin-top: 30px;
            font-style: italic;
            color: #7f8c8d;
        }
        
        @media (max-width: 768px) {
            .input-section {
                flex-direction: column;
            }
            
            .controls {
                flex-wrap: wrap;
            }
            
            .dp-table td {
                width: 40px;
                height: 40px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>最长公共子序列(LCS)算法可视化</h1>
            <p class="subtitle">动态规划算法的逐步演示</p>
        </header>
        
        <section class="input-section">
            <div class="input-group">
                <label for="string1">字符串1:</label>
                <input type="text" id="string1" value="ABCBDAB" maxlength="10">
            </div>
            
            <div class="input-group">
                <label for="string2">字符串2:</label>
                <input type="text" id="string2" value="BDCAB" maxlength="10">
            </div>
        </section>
        
        <div class="controls">
            <button id="startBtn">开始演示</button>
            <button id="nextBtn" disabled>下一步</button>
            <button id="resetBtn">重置</button>
            <button id="autoBtn">自动播放</button>
        </div>
        
        <div class="visualization">
            <div id="dpTableContainer"></div>
        </div>
        
        <div class="info-panel">
            <h2>算法执行信息</h2>
            <div class="info-content">
                <div class="step-info" id="stepInfo">准备开始演示...</div>
                <div id="algorithmInfo">
                    <p>最长公共子序列(LCS)算法使用动态规划解决两个序列的公共子序列问题。</p>
                    <p>动态规划表构建规则：</p>
                    <ol>
                        <li>当字符匹配时：dp[i][j] = dp[i-1][j-1] + 1</li>
                        <li>当字符不匹配时：dp[i][j] = max(dp[i-1][j], dp[i][j-1])</li>
                    </ol>
                    <p class="result">最长公共子序列: <span id="lcsResult">等待计算...</span></p>
                </div>
            </div>
        </div>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-box" style="background-color: #3498db;"></div>
                <span>当前计算单元格</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background-color: #e1f5fe;"></div>
                <span>已计算单元格</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background-color: #2ecc71;"></div>
                <span>字符匹配点</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background-color: #f1c40f;"></div>
                <span>回溯路径</span>
            </div>
        </div>
        
        <div class="complexity">
            <p>时间复杂度: O(m*n) | 空间复杂度: O(m*n) | 其中m和n分别是两个字符串的长度</p>
        </div>
    </div>

    <script>
        // 全局变量
        let dpTable = [];
        let str1 = "";
        let str2 = "";
        let currentStep = 0;
        let totalSteps = 0;
        let isAutoPlay = false;
        let autoPlayInterval = null;
        let isBacktracking = false;
        let lcsPath = [];
        let backtrackSteps = [];
        let backtrackIndex = 0;

        // DOM元素
        const startBtn = document.getElementById('startBtn');
        const nextBtn = document.getElementById('nextBtn');
        const resetBtn = document.getElementById('resetBtn');
        const autoBtn = document.getElementById('autoBtn');
        const stepInfo = document.getElementById('stepInfo');
        const lcsResult = document.getElementById('lcsResult');
        const dpTableContainer = document.getElementById('dpTableContainer');
        const string1Input = document.getElementById('string1');
        const string2Input = document.getElementById('string2');

        // 初始化函数
        function init() {
            str1 = string1Input.value.trim().toUpperCase();
            str2 = string2Input.value.trim().toUpperCase();
            
            if (!str1 || !str2) {
                alert("请输入两个有效的字符串!");
                return;
            }
            
            // 初始化DP表
            initializeDPTable();
            
            // 渲染初始DP表
            renderDPTable();
            
            // 更新UI状态
            startBtn.disabled = true;
            nextBtn.disabled = false;
            autoBtn.disabled = false;
            
            stepInfo.textContent = "初始化完成。第一行和第一列已设置为0。";
            currentStep = 0;
            totalSteps = str1.length * str2.length;
            isBacktracking = false;
            backtrackSteps = [];
            backtrackIndex = 0;
            lcsPath = [];
            
            // 准备回溯步骤
            prepareBacktrackSteps();
        }

        // 初始化DP表
        function initializeDPTable() {
            const m = str1.length;
            const n = str2.length;
            
            dpTable = [];
            
            // 创建并初始化DP表
            for (let i = 0; i <= m; i++) {
                dpTable[i] = [];
                for (let j = 0; j <= n; j++) {
                    if (i === 0 || j === 0) {
                        dpTable[i][j] = 0;
                    } else {
                        dpTable[i][j] = -1; // -1 表示未计算
                    }
                }
            }
        }

        // 准备回溯步骤
        function prepareBacktrackSteps() {
            const m = str1.length;
            const n = str2.length;
            
            // 从右下角开始
            let i = m;
            let j = n;
            
            while (i > 0 && j > 0) {
                backtrackSteps.push({i, j});
                
                if (str1[i-1] === str2[j-1]) {
                    lcsPath.push({i, j});
                    i--;
                    j--;
                } else if (dpTable[i-1][j] > dpTable[i][j-1]) {
                    i--;
                } else {
                    j--;
                }
            }
            
            // 反转路径以便正确显示
            lcsPath.reverse();
            backtrackSteps.reverse();
        }

        // 渲染DP表
        function renderDPTable() {
            const m = str1.length;
            const n = str2.length;
            
            let tableHTML = '<table class="dp-table"><tr><th></th><th></th>';
            
            // 创建表头 (字符串2)
            for (let j = 0; j < n; j++) {
                tableHTML += `<th class="dp-header">${str2[j]}</th>`;
            }
            tableHTML += '</tr>';
            
            // 创建表格内容
            for (let i = 0; i <= m; i++) {
                tableHTML += '<tr>';
                
                // 第一列 (字符串1)
                if (i === 0) {
                    tableHTML += '<th class="dp-header"></th>';
                } else {
                    tableHTML += `<th class="dp-header">${str1[i-1]}</th>`;
                }
                
                for (let j = 0; j <= n; j++) {
                    let cellClass = 'dp-cell-empty';
                    let cellContent = '';
                    
                    if (i === 0 && j === 0) {
                        cellClass = 'dp-cell-empty';
                        cellContent = '';
                    } else if (i === 0 || j === 0) {
                        cellClass = 'dp-cell-visited';
                        cellContent = dpTable[i][j];
                    } else {
                        if (dpTable[i][j] !== -1) {
                            cellClass = 'dp-cell-visited';
                            cellContent = dpTable[i][j];
                        }
                        
                        // 检查是否是当前步骤
                        if (!isBacktracking && currentStep > 0) {
                            const stepI = Math.floor((currentStep - 1) / n) + 1;
                            const stepJ = (currentStep - 1) % n + 1;
                            
                            if (i === stepI && j === stepJ) {
                                cellClass = 'dp-cell-current';
                            }
                        }
                        
                        // 检查是否是回溯路径
                        if (isBacktracking) {
                            for (const step of backtrackSteps.slice(0, backtrackIndex)) {
                                if (i === step.i && j === step.j) {
                                    cellClass = 'path-cell';
                                }
                            }
                        }
                        
                        // 检查是否是匹配点
                        for (const point of lcsPath) {
                            if (i === point.i && j === point.j) {
                                cellClass = 'dp-cell-match';
                            }
                        }
                    }
                    
                    tableHTML += `<td class="${cellClass}">${cellContent}</td>`;
                }
                
                tableHTML += '</tr>';
            }
            
            tableHTML += '</table>';
            dpTableContainer.innerHTML = tableHTML;
        }

        // 执行下一步
        function nextStep() {
            if (!isBacktracking) {
                if (currentStep < totalSteps) {
                    const m = str1.length;
                    const n = str2.length;
                    
                    const i = Math.floor(currentStep / n) + 1;
                    const j = currentStep % n + 1;
                    
                    // 计算DP值
                    if (str1[i-1] === str2[j-1]) {
                        dpTable[i][j] = dpTable[i-1][j-1] + 1;
                        stepInfo.textContent = `计算位置 (${i},${j}): 字符 ${str1[i-1]} 匹配, 值 = ${dpTable[i-1][j-1]} + 1 = ${dpTable[i][j]}`;
                    } else {
                        dpTable[i][j] = Math.max(dpTable[i-1][j], dpTable[i][j-1]);
                        stepInfo.textContent = `计算位置 (${i},${j}): 字符 ${str1[i-1]} 和 ${str2[j-1]} 不匹配, 值 = max(${dpTable[i-1][j]}, ${dpTable[i][j-1]}) = ${dpTable[i][j]}`;
                    }
                    
                    currentStep++;
                    renderDPTable();
                    
                    if (currentStep === totalSteps) {
                        stepInfo.textContent = "DP表构建完成! 准备开始回溯查找最长公共子序列...";
                        isBacktracking = true;
                    }
                }
            } else {
                // 回溯阶段
                if (backtrackIndex < backtrackSteps.length) {
                    renderDPTable();
                    
                    const step = backtrackSteps[backtrackIndex];
                    let info = `回溯步骤 ${backtrackIndex + 1}: 位置 (${step.i},${step.j}) `;
                    
                    if (str1[step.i-1] === str2[step.j-1]) {
                        info += `- 字符 ${str1[step.i-1]} 匹配, 添加到LCS`;
                    } else {
                        const left = dpTable[step.i][step.j-1];
                        const top = dpTable[step.i-1][step.j];
                        
                        if (top >= left) {
                            info += `- 向上移动 (${top} >= ${left})`;
                        } else {
                            info += `- 向左移动 (${left} > ${top})`;
                        }
                    }
                    
                    stepInfo.textContent = info;
                    backtrackIndex++;
                    
                    // 显示最终结果
                    if (backtrackIndex === backtrackSteps.length) {
                        const lcs = lcsPath.map(p => str1[p.i-1]).join('');
                        lcsResult.textContent = lcs || "(无公共子序列)";
                        stepInfo.textContent += ` | 找到LCS: "${lcs}"`;
                        nextBtn.disabled = true;
                        autoBtn.disabled = true;
                    }
                }
            }
        }

        // 自动播放
        function toggleAutoPlay() {
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
                autoBtn.textContent = "自动播放";
                nextBtn.disabled = false;
            } else {
                autoBtn.textContent = "停止播放";
                nextBtn.disabled = true;
                autoPlayInterval = setInterval(() => {
                    if ((!isBacktracking && currentStep < totalSteps) || 
                        (isBacktracking && backtrackIndex < backtrackSteps.length)) {
                        nextStep();
                    } else {
                        toggleAutoPlay();
                    }
                }, 1500);
            }
        }

        // 重置演示
        function resetDemo() {
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
                autoBtn.textContent = "自动播放";
            }
            
            dpTable = [];
            currentStep = 0;
            totalSteps = 0;
            isBacktracking = false;
            backtrackSteps = [];
            backtrackIndex = 0;
            lcsPath = [];
            
            dpTableContainer.innerHTML = "";
            stepInfo.textContent = "准备开始演示...";
            lcsResult.textContent = "等待计算...";
            
            startBtn.disabled = false;
            nextBtn.disabled = true;
            autoBtn.disabled = true;
        }

        // 事件监听
        startBtn.addEventListener('click', init);
        nextBtn.addEventListener('click', nextStep);
        resetBtn.addEventListener('click', resetDemo);
        autoBtn.addEventListener('click', toggleAutoPlay);
        
        // 初始化
        resetDemo();
    </script>
</body>
</html>
